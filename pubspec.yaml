name: logo_tracker
description: Conveyor logo tracking with OpenCV template matching.
publish_to: none
version: 1.0.0
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  opencv_dart: ^2.2.2
  shared_preferences: ^2.2.0
  wakelock_plus: ^1.2.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
